let progT0=0;
const fmtB=n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB';
const fmtS=s=>s<60?s+' s':Math.floor(s/60)+' min '+(s%60)+' s';
function progDet(s){const e=$('pdet');e.style.display=s?'block':'none';e.textContent=s||''}
function barOff(){const b=$('bar');b.style.display='none';progDet('');progT0=0;$('prog').classList.remove('busy')}
function barPct(p,done,total,unit){
  const b=$('bar');b.style.display='block';const i=b.firstChild;i.style.transition='none';i.style.width=p+'%';
  if(!progT0)progT0=Date.now();
  const el=Math.round((Date.now()-progT0)/1000);
  let s=Math.round(p)+' %';
  if(total)s+=' · '+(unit==='n'?done+' / '+total:fmtB(done)+' / '+fmtB(total));
  s+=' · '+fmtS(el);
  if(p>=5&&p<100&&el>=2)s+=' ('+t('p_left',fmtS(Math.max(1,Math.round(el*(100-p)/p))))+')';
  progDet(s);$('prog').classList.add('busy');
}
function barRun(sec){const b=$('bar');b.style.display='block';$('prog').classList.add('busy');const i=b.firstChild;i.style.transition='none';i.style.width='0';void i.offsetWidth;i.style.transition='width '+sec+'s linear';i.style.width='100%'}
let cdT=null;
function cdStop(){clearInterval(cdT);cdT=null}
function cdStart(key,est,...a){ // "Drawing slide 3: 12 s of about 26"
  cdStop();const t0=Date.now();barRun(est);
  const f=()=>{const el=Math.round((Date.now()-t0)/1000);activity=t(key,...a,el,est);setStatus();progDet(t('p_draw',fmtS(el),est))};

  else s=t('st_off');
  $('st').textContent=s;
}
function refreshUi(){
  const on=connected&&!opBusy;
  document.querySelectorAll('.c').forEach(b=>b.disabled=!on);
  $('otain').disabled=!on||!S.otaOk;
  $('sfile').disabled=!on;
  $('bc').hidden=connected||connecting;$('bx').hidden=!connecting;$('bd').hidden=!connected;$('bd').disabled=!!opBusy;
  $('alldrow').hidden=connected||connecting;
  $('main').hidden=!connected;
  $('cup').textContent=t('cv_up',S.up);$('cvto').textContent=t('slot_n',S.up);$('cup').disabled=!on;

function renderNfc(){
  const e=$('nfcinfo');if(!e)return;
  const n=S.nfc;
  if(!n){e.textContent='';return}
  let m;
  if(!n.present)m=t('nfc_none');
  else if(n.kind===1)m=t('nfc_url',n.text);
  else if(n.kind===2)m=t('nfc_txt',n.text);
  else if(n.kind===3)m=t('nfc_wifi',n.text);
  else if(n.kind===4)m=t('nfc_other');
  else m=t('nfc_nourl');
  if(S.tap){const left=Math.max(0,S.tap.left-Math.round((Date.now()-S.tap.at)/1000));m+=' · '+(left>0?t('tap_open',left):t('tap_closed'))}
  e.textContent=m;
  $('nfccap').textContent=n.present&&n.cap?t('nfc_cap',n.cap):'';

function renderTag(){
  const e=$('tinfo');e.textContent='';
  const row=(a,b)=>{const p=document.createElement('div');p.textContent=a+': '+b;e.appendChild(p);return p};
  row(t('fw'),S.fw==null?'…':'v'+S.fw);
  row(t('bat'),S.mv==null?'…':(S.mv/1000).toFixed(2)+' V'+(S.bat?' ('+S.bat.pct+' %)':''));
  if(S.bat&&S.bat.min>0)row(t('minv'),(S.bat.min/1000).toFixed(2)+' V');
  row(t('temp'),S.tc==null?'…':S.tc+' °C');
  if(S.pt!=null)row(t('ptemp'),S.pt+' °C');
  if(S.id){
    const p=row(t('id'),S.showId?S.id:'●●●●●●●●●●●●●●●●');
    const a=document.createElement('button');a.className='lnk';a.type='button';a.textContent=' '+t(S.showId?'hideid':'showid');
    a.onclick=()=>{S.showId=!S.showId;renderTag()};p.appendChild(a);
  }
  if(S.rc!=null)row(t('lastrst'),rcText(S.rc));
  if(S.panel)row(t('panel'),S.panel.w>0?S.panel.name+' '+S.panel.w+'×'+S.panel.h+' ('+t('tagtype')+' 0x'+S.panel.tag+', ctrl 0x'+S.panel.ctrl+')':t('panel_none',S.panel.ctrl));
  row(t('pagev'),'v'+PAGE_V);
  const w=$('warn'),msg=[];
  if(S.fw!=null&&S.fw!==PAGE_V)msg.push(t('warnv',S.fw,PAGE_V));
  if(S.bat&&S.bat.low)msg.push(t('lowbat'));
  w.hidden=!msg.length;w.textContent=msg.join(' ');

function rcText(rc){ // EMU_RSTCAUSE bits of the EFR32BG22
  const r=[];
  if(rc&1)r.push(t('rc_por'));if(rc&2)r.push(t('rc_pin'));if(rc&4)r.push(t('rc_em4'));if(rc&8)r.push(t('rc_wdog'));
  if(rc&0x20)r.push(t('rc_lock'));if(rc&0x40)r.push(t('rc_sys'));if(rc&0x780)r.push(t('rc_bod'));
  return (r.length?r.join(', '):t('rc_none'))+' (0x'+rc.toString(16)+')';
}

const thKey=s=>'th_'+(S.id||'x')+'_'+s, nmKey=s=>'nm_'+(S.id||'x')+'_'+s;
const PALC=[[22,22,22],[226,226,216],[228,200,32],[176,36,30]];
function frameToThumb(f){ // frame codes -> canvas of half size, 2x2 average
  const w=PW>>1,h=PH>>1,lb=LB();
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d'),im=g.createImageData(w,h);
  const px=(x,y)=>PALC[f[y*lb+(x>>2)]>>(6-2*(x&3))&3];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let r=0,gg=0,b=0;for(let j=0;j<2;j++)for(let i=0;i<2;i++){const p=px(2*x+i,2*y+j);r+=p[0];gg+=p[1];b+=p[2]}
    const o=(y*w+x)*4;im.data[o]=r>>2;im.data[o+1]=gg>>2;im.data[o+2]=b>>2;im.data[o+3]=255;
  }
  g.putImageData(im,0,0);return cv;
}
function thSet(s,crc,frame){
  const cv=frameToThumb(frame);S.th[s]={crc,cv};

    const ll=lit[1]-lit[0];out.push((Math.min(ll,15)<<4)|(ml<0?0:Math.min(ml-4,15)));

function xorLines(f){const lb=LB(),o=f.slice();for(let y=f.length/lb-1;y>0;y--)for(let x=0;x<lb;x++)o[y*lb+x]=f[y*lb+x]^f[(y-1)*lb+x];return o}
function orientFrame(){ // a picture with a big F and an arrow, drawn upright on the page: how the tag shows it tells the orientation
  const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,PW,PH);
  const u=Math.min(PW,PH)/200;
  g.fillStyle='#000';g.font='bold '+Math.round(120*u)+'px sans-serif';g.textBaseline='alphabetic';g.textAlign='left';
  g.fillText('F',Math.round(16*u),Math.round(130*u));
  g.fillStyle='#d00';g.beginPath();                        // red arrow up on the right
  const ax=PW-Math.round(40*u);
  g.moveTo(ax,Math.round(10*u));g.lineTo(ax+Math.round(26*u),Math.round(50*u));g.lineTo(ax+Math.round(10*u),Math.round(50*u));g.lineTo(ax+Math.round(10*u),Math.round(110*u));

  g.fillStyle='#000';g.font='bold '+Math.round(16*u)+'px sans-serif';g.textAlign='center';g.fillText('UP',PW/2,Math.round(PH-8*u));
  g.fillRect(0,0,PW,3);g.fillRect(0,0,3,PH);                // left and top edge marked, so mirror and flip show
  const d=g.getImageData(0,0,PW,PH).data,f=new Uint8Array(FBY()),lb=LB();
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++){
    const o=(y*PW+x)*4,r=d[o],gg=d[o+1],b=d[o+2];

function testFrame(){ // codes black 0 white 1 yellow 2 red 3, any panel size
  const f=new Uint8Array(FBY()),lb=LB();
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++){
    const q=PH/4;
    let c=(x<4||y<4||x>=PW-4||y>=PH-4)?0:(y<q?1:y<2*q?2:y<3*q?3:((x>>3)+(y>>3))&1?0:1);

async function upload(frame,slot){
  const fmt=+$('sf').value,win=+$('sw').value||8;
  const st=fmt===0?frame:lz4(fmt===2?xorLines(frame):frame), crc=crc32(st), L=st.length;
  log('upload slot '+slot+' fmt '+fmt+': '+L+' bytes, crc '+crc.toString(16));
  const rd=waitLine(/^UP (READY|FAIL)|no room|^ERR/,15000);rd.catch(()=>{});
  await send([0x42,slot,L&255,L>>8&255,L>>16&255,L>>>24,crc&255,crc>>8&255,crc>>16&255,crc>>>24,win,fmt]);
  const r=await rd; const m=/chunk=(\d+) win=(\d+)/.exec(r); if(!m) throw new Error(r);
  const C=+m[1],W=+m[2];let seq=0,off=0;const t0=Date.now();
  while(off<L){
    const n=Math.min(C,L-off),a=new Uint8Array(3+n);a[0]=0x43;a[1]=seq&255;a[2]=seq>>8;a.set(st.subarray(off,off+n),3);
    const last=off+n>=L,ack=((seq+1)%W===0)||last;
    const w=ack?waitLine(/^UP (ACK|FAIL)/,15000):null;if(w)w.catch(()=>{});
    await send(a,true);off+=n;seq++;
    if(w){const x=await w;if(/FAIL/.test(x))throw new Error(x)}
    const p=Math.round(off*100/L);barPct(p,off,L);activity=t('a_up',p);setStatus();
  }
  const ok=waitLine(/^UP (OK|FAIL)/,20000);ok.catch(()=>{});await send([0x44]);const x=await ok;
  if(/FAIL/.test(x))throw new Error(x);
  log('upload took '+(Date.now()-t0)+' ms');
  return crc>>>0;
}

  for(const x of Array.from(S.sel))if(!S.slots[x])S.sel.delete(x);
  $('selbtn').hidden=S.selMode||!n;$('selbtn').disabled=!on;
  $('selops').hidden=!S.selMode;

function selToggle(i){if(!(connected&&!opBusy))return;if(S.sel.has(i))S.sel.delete(i);else S.sel.add(i);renderSlots()}

function selNone(){S.sel.clear();renderSlots()}
function selDone(){S.selMode=false;S.sel.clear();renderSlots()}
function doEraseSel(){
  const used=Object.keys(S.slots).map(Number),list=used.filter(i=>S.sel.has(i)).sort((a,b)=>a-b);
  if(!list.length)return;
  const all=list.length===used.length;
  if(!confirm(all?t('c_erase_all',list.length):t('c_erase_n',list.length)))return;
  return op(t('a_erase'),async()=>{
    let done=0;
    try{
      if(all){const r=await ask([0x41,0xFF],/^ERASED|^ERR/,90000);if(/^ERR/.test(r))throw new Error(r);done=list.length}
      else for(const s of list){const r=await ask([0x41,s],/^ERASED|^ERR/,20000);if(/^ERR/.test(r))throw new Error(r);done++}
    }finally{
      for(const s of list.slice(0,done))delete S.th[s];
      S.sel.clear();
      await refreshList();
    }
    if(all){S.mask=0;try{const a=ssArgs();if(a)await ask(a,/^SS|^ERR/,6000)}catch(e){}}   // an empty tag: the slideshow takes every new slide again
    S.selMode=false;renderSlots();

  });
}

const OTA_MAX=0x3B000;

function gblEnd(u){ // walks the GBL tags like the bootloader does (id32, length32, data); returns the offset after the End tag, or -1
  const g=o=>(u[o]|u[o+1]<<8|u[o+2]<<16|u[o+3]<<24)>>>0;
  let o=0;
  while(o+8<=u.length){
    const id=g(o),l=g(o+4);
    if(id===0xFC0404FC)return l===4&&o+12<=u.length?o+12:-1;
    o+=8+l;
  }
  return -1;
}
function otaInspect(u,name){ // returns [] when the file is usable, else a list of reasons
  const bad=[];
  if(u.length>OTA_MAX)bad.push(t('ota_e_size',OTA_MAX));
  if(!(u.length>=64&&u[0]===0xEB&&u[1]===0x17&&u[2]===0xA6&&u[3]===0x03))bad.push(t('ota_e_gbl'));
  else{
    const mk=enc('BG22BADG');let f=false;
    for(let i=0;i+8<=u.length&&!f;i++){let k=0;while(k<8&&u[i+k]===mk[k])k++;f=k===8}
    if(!f)bad.push(t('ota_e_prod'));
    const e=gblEnd(u);
    if(e<0)bad.push(t('ota_e_end'));
    else{
      // the bootloader checks the CRC-32 over everything up to and including the End tag's own CRC: the result is this constant (bytes after the End tag are ignored)
      const c=crc32(u.subarray(0,e));
      if(c!==0x2144DF1C)bad.push(t('ota_e_crc',e,u.length,c.toString(16).toUpperCase()));
    }
  }

}

    S.otaOk=false;refreshUi();

    const rd=waitLine(/^OTA (READY|FAIL)/,15000);rd.catch(()=>{});
    await send([0x46,1,L&255,L>>8&255,L>>16&255,L>>>24,crc&255,crc>>8&255,crc>>16&255,crc>>>24,win]);
    const r=await rd;const m=/chunk=(\d+) win=(\d+)/.exec(r);if(!m)throw new Error(/tap/.test(r)?t('e_tap'):r);
    const C=+m[1],W=+m[2];let seq=0,off=0;const t0=Date.now();
    while(off<L){
      const n=Math.min(C,L-off),a=new Uint8Array(4+n);a[0]=0x46;a[1]=2;a[2]=seq&255;a[3]=seq>>8;a.set(u.subarray(off,off+n),4);

      await send(a,true);off+=n;seq=(seq+1)&0xFFFF;
      if(w){const x=await w;if(/FAIL/.test(x))throw new Error(x)}

// ---- picture converter: any image -> the panel size (PW x PH), four panel colours ----
const PALS={panel:PALC,pure:[[0,0,0],[255,255,255],[255,255,0],[255,0,0]],mono:PALC}; // codes: black 0, white 1, yellow 2, red 3
const PRESETS={
  photo:{dith:'fs',pal:'panel',bri:0,con:10,sat:10,sharp:0},
  vivid:{dith:'atk',pal:'panel',bri:0,con:20,sat:50,sharp:1},
  graphic:{dith:'none',pal:'pure',bri:0,con:30,sat:20,sharp:0},
  mono:{dith:'fs',pal:'mono',bri:0,con:20,sat:-100,sharp:1},
  retro:{dith:'bayer',pal:'pure',bri:0,con:20,sat:30,sharp:0}
};
function bayerMatrix(n){let m=[[0]];for(let s=1;s<n;s*=2){const o=[];for(let y=0;y<2*s;y++){o[y]=[];for(let x=0;x<2*s;x++)o[y][x]=m[y%s][x%s]*4+[[0,2],[3,1]][y>=s?1:0][x>=s?1:0]}m=o}return m}
const BAY=bayerMatrix(8);
let cvImg=null,cvFrame=null,cvPx=0,cvPy=0;   // cvPx/cvPy: picture shift in panel pixels (drag the preview), zoom slider 'czoom'
function cvPreset(name){
  const p=PRESETS[name];if(!p)return;
  $('cdith').value=p.dith;$('cpal').value=p.pal;$('cbri').value=p.bri;$('ccon').value=p.con;$('csat').value=p.sat;$('csharp').value=p.sharp;
}
function cvRender(){
  if(!cvImg)return;
  const fit=$('cfit').value,dith=$('cdith').value,palName=$('cpal').value,pal=PALS[palName],allow=palName==='mono'?[0,1]:[0,1,2,3];
  const bri=+$('cbri').value,con=+$('ccon').value,sat=1+(+$('csat').value)/100,sh=+$('csharp').value,cvRot=+$('crot').value;
  const rot=cvRot&1,sw=rot?cvImg.height:cvImg.width,sh0=rot?cvImg.width:cvImg.height;
  const src=document.createElement('canvas');src.width=sw;src.height=sh0;
  const sg=src.getContext('2d');sg.translate(sw/2,sh0/2);sg.rotate(cvRot*Math.PI/2);sg.drawImage(cvImg,-cvImg.width/2,-cvImg.height/2);
  const c=document.createElement('canvas');c.width=PW;c.height=PH;const g=c.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#fff';g.fillRect(0,0,PW,PH);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  if(fit==='stretch')g.drawImage(src,0,0,PW,PH);
  else{
    const zm=(+$('czoom').value||100)/100,k=(fit==='cover'?Math.max(PW/sw,PH/sh0):Math.min(PW/sw,PH/sh0))*zm,w=sw*k,h=sh0*k;
    const lim=(d,L)=>Math.abs(L-d)/2;                       // how far the picture may move from the centre: its edge stays inside the panel
    cvPx=Math.max(-lim(w,PW),Math.min(lim(w,PW),cvPx));cvPy=Math.max(-lim(h,PH),Math.min(lim(h,PH),cvPy));
    g.drawImage(src,(PW-w)/2+cvPx,(PH-h)/2+cvPy,w,h);
  }
  const d=g.getImageData(0,0,PW,PH).data,f=new Float32Array(PW*PH*3),fac=con===0?1:(259*(con+255))/(255*(259-con));
  for(let i=0;i<PW*PH;i++){
    const r=d[i*4],gg=d[i*4+1],b=d[i*4+2],gray=0.299*r+0.587*gg+0.114*b;
    for(let ch=0;ch<3;ch++){let v=d[i*4+ch];v=gray+(v-gray)*sat;v=fac*(v-128)+128+bri*2.55;f[i*3+ch]=v<0?0:v>255?255:v}
  }
  if(sh>0){ // unsharp mask with a 3x3 mean
    const o=new Float32Array(f.length),a=sh*0.7;
    for(let y=0;y<PH;y++)for(let x=0;x<PW;x++)for(let ch=0;ch<3;ch++){
      let s=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const xx=Math.min(PW-1,Math.max(0,x+i)),yy=Math.min(PH-1,Math.max(0,y+j));s+=f[(yy*PW+xx)*3+ch]}
      const v=f[(y*PW+x)*3+ch],bl=s/9,r=v+a*(v-bl);o[(y*PW+x)*3+ch]=r<0?0:r>255?255:r;
    }
    f.set(o);
  }
  const out=new Uint8Array(FBY()),lb=LB(),prev=document.createElement('canvas');prev.width=PW;prev.height=PH;
  const pg=prev.getContext('2d'),pim=pg.createImageData(PW,PH);
  const add=(x,y,e,w)=>{if(x<0||x>=PW||y>=PH)return;const o=(y*PW+x)*3;f[o]+=e[0]*w;f[o+1]+=e[1]*w;f[o+2]+=e[2]*w};
  for(let y=0;y<PH;y++)for(let x=0;x<PW;x++){
    const o=(y*PW+x)*3;let r=f[o],gg=f[o+1],b=f[o+2];
    if(dith==='bayer'){const bt=((BAY[y&7][x&7]+0.5)/64-0.5)*90;r+=bt;gg+=bt;b+=bt}
    let best=0,bd=1e18;
    for(const k of allow){const p=pal[k],dr=r-p[0],dg=gg-p[1],db=b-p[2],dd=dr*dr*0.30+dg*dg*0.59+db*db*0.11;if(dd<bd){bd=dd;best=k}}
    const p=pal[best];out[y*lb+(x>>2)]|=best<<(6-2*(x&3));
    const q=(y*PW+x)*4;pim.data[q]=p[0];pim.data[q+1]=p[1];pim.data[q+2]=p[2];pim.data[q+3]=255;
    if(dith==='fs'||dith==='atk'){
      const e=[f[o]-p[0],f[o+1]-p[1],f[o+2]-p[2]];
      if(dith==='fs'){add(x+1,y,e,7/16);add(x-1,y+1,e,3/16);add(x,y+1,e,5/16);add(x+1,y+1,e,1/16)}
      else{const w=1/8;add(x+1,y,e,w);add(x+2,y,e,w);add(x-1,y+1,e,w);add(x,y+1,e,w);add(x+1,y+1,e,w);add(x,y+2,e,w)}
    }
  }
  pg.putImageData(pim,0,0);
  $('cvp').getContext('2d').drawImage(prev,0,0);
  cvFrame=out;
}
let cvT=0;function cvSoon(){cancelAnimationFrame(cvT);cvT=requestAnimationFrame(()=>setTimeout(cvRender,0))}
$('cpre').addEventListener('change',()=>{if($('cpre').value!=='custom')cvPreset($('cpre').value);cvSoon()});
['cdith','cpal','cbri','ccon','csat','csharp'].forEach(id=>$(id).addEventListener('input',()=>{$('cpre').value='custom';cvSoon()}));
['cfit','crot'].forEach(id=>$(id).addEventListener('input',()=>{cvPx=cvPy=0;cvSoon()}));
$('czoom').addEventListener('input',cvSoon);
(()=>{ // drag the preview to move the picture; double tap resets
  const cp=$('cvp');let drag=null;
  cp.style.touchAction='none';cp.style.cursor='grab';
  cp.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:cvPx,py:cvPy};cp.setPointerCapture(e.pointerId)});
  cp.addEventListener('pointermove',e=>{
    if(!drag)return;const r=cp.getBoundingClientRect(),s=PW/(r.width||PW);
    cvPx=drag.px+(e.clientX-drag.x)*s;cvPy=drag.py+(e.clientY-drag.y)*s;cvSoon()});
  const end=()=>{drag=null};cp.addEventListener('pointerup',end);cp.addEventListener('pointercancel',end);
  cp.addEventListener('dblclick',()=>{cvPx=cvPy=0;$('czoom').value=100;cvSoon()});
})();

$('sfile').onchange=async()=>{
  const f=$('sfile').files[0];if(!f)return;$('sfile').value='';
  upName=f.name.replace(/\.[^.]*$/,'').slice(0,24);
  if(/\.bin$/i.test(f.name)||(!f.type.startsWith('image/')&&f.size===FBY())){
    const b=new Uint8Array(await f.arrayBuffer());
    if(b.length!==FBY()){toast(t('e_file',FBY()),true);return}
    doUpload(b);return;
  }
  try{
    cvImg=await createImageBitmap(f);cvPx=cvPy=0;$('czoom').value=100;$('crot').value='0';$('cpre').value='photo';cvPreset('photo');
    $('cv').hidden=false;refreshUi();cvRender();
    $('cv').scrollIntoView({block:'nearest'});
  }catch(e){toast(t('e_file'),true);log('image: '+e.message)}
};

$('bclear').onclick=()=>{logEl.textContent='';$('cmsg').textContent=''};
$('bcopy').onclick=async()=>{
  const x=logEl.textContent;
  try{await navigator.clipboard.writeText(x)}
  catch(e){const ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e2){}document.body.removeChild(ta)}
  $('cmsg').textContent=t('copied');setTimeout(()=>$('cmsg').textContent='',1500);
};
$('bsave').onclick=()=>{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name='pin16-log-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.txt';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([logEl.textContent],{type:'text/plain'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
};
